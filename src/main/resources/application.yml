spring:
  application:
    name: be-interview-prep
  datasource:
    url: jdbc:h2:mem:interviewprep;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
